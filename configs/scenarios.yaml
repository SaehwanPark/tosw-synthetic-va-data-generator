# Scenario manifest for the semi-synthetic VA CAN datasets.
#
# Each record is one historical scenario name. Records with `enabled: true`
# form the published scenario grid and are written by
#     python -m tosw_synth generate --enabled
#
# Fields:
#   age_shift       shift added to the truncated-normal mean age, in years
#   alpha           outcome log-odds intercept adjustment
#   beta            outcome log-odds slope multiplier (must stay positive)
#   priority_shift  percentage-point shift from priority groups 6-8 to group 1
#   seed            base seed; a replicate uses seed + replicate_index
#   n_samples       historical row count
#
# Records with `enabled: false` are retained so the historical scenario
# families stay documented. They are never written unless requested by name.
# `seed: null` means the historical scripts assigned indexes from more than
# one loop, so no single base seed applies.
scenarios:
